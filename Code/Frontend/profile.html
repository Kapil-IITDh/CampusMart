<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CSS files -->
    <link rel="stylesheet" href="./assets/css/profile.css">
    <link rel="stylesheet" href="./assets/css/NavbarFirst.css">
    <link rel="stylesheet" href="./assets/css/NavbarSecond.css">
    <link rel="stylesheet" href="./assets/css/Footer.css">

    <title>Profile</title>
</head>

<body>
    <!-- Navbar -->
    <div id="NavbarFirst"></div>
    <div id="NavbarSecond" style="display: none;"></div>

    <!-- Account Heading -->
    <h2>Account</h2>

    <div class="account-container">
        <div class="account-sidebar">
            <p>Account</p>
            <p>Transaction</p>
            <p>Manage listing</p>
            <button class="logout-btn" onclick="signOut()">Logout</button>
            <p>Your Rating</p>
            <div class="rating-box">5 stars</div>
        </div>

        <div class="account-details">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="First Last Name" readonly>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="email@example.com" readonly>
            </div>
            <div class="form-group">
                <label for="phone">Phone number:</label>
                <input type="text" id="phone" placeholder="1234567890" readonly>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Password" readonly>
            </div>
            <button class="edit-btn">Edit</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div id="Footer"></div>
    </footer>

    <!-- JavaScript for loading user data from localStorage -->
    <script>
        // Check if user data is available in localStorage
        const storedUserData = localStorage.getItem('user');

        if (storedUserData) {
            const userData = JSON.parse(storedUserData); // Parse the JSON string

            // Populate the HTML elements with the user data
            document.getElementById("name").value = userData.name || '';
            document.getElementById("email").value = userData.email || '';
            document.getElementById("phone").value = userData.phoneNumber || '';
            document.getElementById("password").value = "********"; // Placeholder for password

            console.log('User data loaded from localStorage:', userData);
        } else {
            console.error('No user data found in localStorage.');
            alert('No user data found. Please log in.');
            window.location.href = "SignIn.html"; // Redirect to sign-in page if no data is found
        }

        // Function to handle user logout
        function signOut() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('user');
            alert('Logged out successfully.');
            window.location.href = "SignIn.html";
        }
    </script>

    <!-- Javascript files -->
    <script src="js/HeaderFooter.js"></script>
    <script src="js/LoginStatus.js"></script>
    <script src="js/products.js"></script>
</body>

</html>
